[project]
name = "atmoflux"
version = "0.0.1"
description = "Atmospheric and energy flux analysis library by Telluris Labs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Telluris Labs", email = "info@tellurislabs.io" }
]
keywords = ["climate","meteorology", "energy flux", "humidity", "temperature", "thermal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
